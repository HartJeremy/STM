<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11161d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Stage Manager Quick List</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css?v=0.7.2">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="titleblock">
      <div id="productionTitle" class="production-title">Stage Manager</div>
      <h1 id="pageTitle">Tonight</h1>
    </div>
    <span class="tag" title="Deployed app version">v0.7.2</span>
    <button id="installBtn" class="btn secondary compact" hidden>Install</button>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="bottomnav" aria-label="Main navigation">
    <button data-view="tonight" class="navbtn active"><span class="navicon">⌂</span><span>Tonight</span></button>
    <button data-view="presets" class="navbtn"><span class="navicon">✓</span><span>Presets</span></button>
    <button data-view="run" class="navbtn"><span class="navicon">▶</span><span>Run</span></button>
    <button data-view="checkin" class="navbtn"><span class="navicon">●</span><span>Check-in</span></button>
    <button data-view="shows" class="navbtn"><span class="navicon">▦</span><span>Shows</span></button>
    <button data-view="manage" class="navbtn"><span class="navicon">⚙</span><span>Manage</span></button>
  </nav>
</div>

<dialog id="photoDialog" class="photo-dialog">
  <div class="dialog-head"><strong id="photoCaption">Reference photo</strong><button id="closePhoto" class="iconbtn" type="button" aria-label="Close">×</button></div>
  <img id="photoFull" alt="Preset reference">
</dialog>

<dialog id="formDialog" class="form-dialog">
  <form id="editForm" method="dialog">
    <div class="dialog-head"><strong id="formTitle">Edit</strong><button id="closeForm" class="iconbtn" type="button" aria-label="Close">×</button></div>
    <div id="formFields"></div>
    <div class="dialog-actions"><button type="button" id="cancelEdit" class="btn secondary">Cancel</button><button type="submit" class="btn primary">Save</button></div>
  </form>
</dialog>

<dialog id="photoPickerDialog" class="picker-dialog">
  <div class="dialog-head"><div><strong id="photoPickerTitle">Reference photos</strong><div class="muted smalltext">Choose the photos that belong to this location.</div></div><button id="closePhotoPicker" class="iconbtn" type="button" aria-label="Close">×</button></div>
  <div class="picker-actions"><button id="uploadFromPicker" type="button" class="btn secondary">+ Upload photo</button></div>
  <div id="photoPickerGrid" class="image-grid"></div>
  <div class="dialog-actions"><button id="cancelPhotoPicker" type="button" class="btn secondary">Cancel</button><button id="savePhotoPicker" type="button" class="btn primary">Save photos</button></div>
</dialog>

<input id="importFile" type="file" accept=".json,.stage,application/json" hidden>
<input id="imageFile" type="file" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js?v=0.7.2"></script>
<script src="cloud-sync.js?v=0.7.2"></script>
<script src="app.js?v=0.7.2"></script>
</body>
</html>
