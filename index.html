<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11161d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Stage Manager Quick List</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="titleblock">
      <div id="productionTitle" class="production-title">Stage Manager</div>
      <h1 id="pageTitle">Tonight</h1>
    </div>
    <div class="top-actions"><button id="timerBtn" class="btn secondary compact" type="button">⏱ Timer</button><button id="installBtn" class="btn secondary compact" hidden>Install</button></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="bottomnav" aria-label="Main navigation">
    <button data-view="tonight" class="navbtn active"><span class="navicon">⌂</span><span>Tonight</span></button>
    <button data-view="presets" class="navbtn"><span class="navicon">✓</span><span>Presets</span></button>
    <button data-view="run" class="navbtn"><span class="navicon">▶</span><span>Run</span></button>
    <button data-view="checkin" class="navbtn"><span class="navicon">●</span><span>Check-in</span></button>
    <button data-view="shows" class="navbtn"><span class="navicon">▦</span><span>Shows</span></button>
    <button data-view="manage" class="navbtn"><span class="navicon">⚙</span><span>Manage</span></button>
  </nav>
</div>

<dialog id="photoDialog" class="photo-dialog">
  <div class="dialog-head"><strong id="photoCaption">Reference photo</strong><button id="closePhoto" class="iconbtn" type="button" aria-label="Close">×</button></div>
  <img id="photoFull" alt="Preset reference">
</dialog>

<dialog id="formDialog" class="form-dialog">
  <form id="editForm" method="dialog">
    <div class="dialog-head"><strong id="formTitle">Edit</strong><button id="closeForm" class="iconbtn" type="button" aria-label="Close">×</button></div>
    <div id="formFields"></div>
    <div class="dialog-actions"><button type="button" id="cancelEdit" class="btn secondary">Cancel</button><button type="submit" class="btn primary">Save</button></div>
  </form>
</dialog>

<dialog id="photoPickerDialog" class="picker-dialog">
  <div class="dialog-head"><div><strong id="photoPickerTitle">Reference photos</strong><div class="muted smalltext">Choose the photos that belong to this location.</div></div><button id="closePhotoPicker" class="iconbtn" type="button" aria-label="Close">×</button></div>
  <div class="picker-actions"><button id="uploadFromPicker" type="button" class="btn secondary">+ Upload photo</button></div>
  <div id="photoPickerGrid" class="image-grid"></div>
  <div class="dialog-actions"><button id="cancelPhotoPicker" type="button" class="btn secondary">Cancel</button><button id="savePhotoPicker" type="button" class="btn primary">Save photos</button></div>
</dialog>


<dialog id="detailDialog" class="form-dialog"><div class="dialog-head"><strong id="detailTitle">Details</strong><button id="closeDetail" class="iconbtn" type="button">×</button></div><div id="detailBody"></div></dialog>
<dialog id="blockingDialog" class="form-dialog"><div class="dialog-head"><strong id="blockingTitle">Blocking</strong><button id="closeBlocking" class="iconbtn" type="button">×</button></div><div class="formgroup"><label>Act</label><select id="blockingAct"></select></div><div class="split"><div class="formgroup"><label>Scene</label><input id="blockingScene"></div><div class="formgroup"><label>Page</label><input id="blockingPage"></div></div><div class="formgroup"><label>People</label><div id="blockingPeople" class="people-checks"></div></div><div class="formgroup"><label>Blocking notation</label><textarea id="blockingNotation"></textarea></div><div id="blockingQuick"></div><div class="formgroup"><label>Notes</label><textarea id="blockingNotes"></textarea></div><div class="dialog-actions"><button id="cancelBlocking" class="btn secondary" type="button">Cancel</button><button id="saveBlocking" class="btn primary" type="button">Save</button></div></dialog>
<dialog id="movementDialog" class="form-dialog"><div class="dialog-head"><strong id="movementTitle">Usage / movement</strong><button id="closeMovement" class="iconbtn" type="button">×</button></div><div class="formgroup"><label>Type</label><select id="movementType"><option value="prop">Prop</option><option value="set">Set piece</option></select></div><div id="movementPropGroup" class="formgroup"><label>Prop</label><select id="movementProp"></select></div><div id="movementSetGroup" class="formgroup"><label>Set piece</label><select id="movementSet"></select></div><div class="formgroup"><label>Act</label><select id="movementAct"></select></div><div class="split"><div class="formgroup"><label>Scene</label><input id="movementScene"></div><div class="formgroup"><label>Page</label><input id="movementPage"></div></div><div class="formgroup"><label>People</label><div id="movementPeople" class="people-checks"></div></div><div class="split"><div class="formgroup"><label>From</label><input id="movementFrom"></div><div class="formgroup"><label>To</label><input id="movementTo"></div></div><div class="formgroup"><label>Notation / cue</label><textarea id="movementNotation"></textarea></div><div id="movementQuick"></div><div class="formgroup"><label>Notes</label><textarea id="movementNotes"></textarea></div><div class="dialog-actions"><button id="cancelMovement" class="btn secondary" type="button">Cancel</button><button id="saveMovement" class="btn primary" type="button">Save</button></div></dialog>

<input id="importFile" type="file" accept=".json,.stage,application/json" hidden>
<input id="imageFile" type="file" accept="image/*" hidden>

<script src="app.js"></script>
</body>
</html>
